name: Build wheels

# Builds pip wheels WITH the native custom kernels precompiled, so pip users
# get the accelerated GLM-5.2 / MiniMax M3 / Qwen3.5 paths without needing
# the Metal toolchain locally (source installs without it silently fall back
# to much slower generic kernels; see #2137 / #2208).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    # MLX and native Metal kernels require Apple Silicon and macOS 15+.
    uses: ./.github/workflows/native-wheels.yml
    permissions:
      contents: read
  attach-to-release:
    if: github.event_name == 'release'
    needs: build-wheels
    runs-on: kalana-ci
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Set up GitHub CLI without root privileges
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *) echo "::error::Unsupported GitHub CLI architecture"; exit 1 ;;
          esac
          cli_version=2.103.0
          cli_package="gh_${cli_version}_linux_${cli_arch}.tar.gz"
          cli_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli.XXXXXX")"
          cli_url="https://github.com/cli/cli/releases/download/v${cli_version}"
          curl -fsSL --retry 3 "$cli_url/$cli_package" -o "$cli_dir/$cli_package"
          curl -fsSL --retry 3 "$cli_url/gh_${cli_version}_checksums.txt" -o "$cli_dir/checksums.txt"
          (cd "$cli_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$cli_dir/$cli_package" -C "$cli_dir"
          echo "$cli_dir/gh_${cli_version}_linux_${cli_arch}/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Attach wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.whl \
            --repo "${{ github.repository }}" --clobber
